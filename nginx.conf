# Absolute links in the sitemap, robots.txt and social previews use the address
# the visitor came in on, but only http/https schemes and well-formed hosts are
# accepted. Azure's ingress ends TLS and passes the original scheme in
# X-Forwarded-Proto.
map $http_x_forwarded_proto $public_scheme {
    ~^https?$ $http_x_forwarded_proto;
    default  $scheme;
}

map $http_host $public_host {
    "~*^(?<valid_public_host>[a-z0-9.-]+(?::[0-9]{1,5})?)$" $valid_public_host;
    default $host;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative, so they keep the https scheme the visitor used.
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

    # The public website: plain HTML pages that Google and visitors can read
    # without the app. Each page has one clean URL.
    location = / {
        try_files /site/pages/home.html =404;
        add_header Cache-Control "no-cache";
        sub_filter '__SITE_ORIGIN__' '$public_scheme://$public_host';
        sub_filter_once off;
    }

    location ~ ^/(about|contact|privacy|terms|guides|guides/[a-z0-9-]+)$ {
        try_files /site/pages$uri.html =404;
        error_page 404 /site/pages/404.html;
        add_header Cache-Control "no-cache";
        sub_filter '__SITE_ORIGIN__' '$public_scheme://$public_host';
        sub_filter_once off;
    }

    location ~ ^/(about|contact|privacy|terms|guides|guides/[a-z0-9-]+)/$ {
        rewrite ^(.+)/$ $1 permanent;
    }

    # The page files themselves are reachable only through the URLs above.
    location ^~ /site/pages/ {
        internal;
        sub_filter '__SITE_ORIGIN__' '$public_scheme://$public_host';
        sub_filter_once off;
    }

    # Site files keep the same names when they change, so browsers must check
    # for a newer copy before using a cached one. Otherwise a returning visitor
    # gets a new page with an old stylesheet. An unchanged file costs a 304.
    location ^~ /site/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /robots.txt {
        sub_filter '__SITE_ORIGIN__' '$public_scheme://$public_host';
        sub_filter_once off;
        sub_filter_types text/plain;
    }

    location = /sitemap.xml {
        sub_filter '__SITE_ORIGIN__' '$public_scheme://$public_host';
        sub_filter_once off;
        sub_filter_types text/xml application/xml;
    }

    # Written by the Docker build once an AdSense account exists.
    location = /ads.txt {
        try_files $uri =404;
    }

    # Redirect unknown routes to index.html for Flutter Web routing
    location / {
        try_files $uri /index.html;
    }

    # Serve static assets correctly
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Access-Control-Allow-Origin *;
    }

    # Serve fonts, images, and JS correctly
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?)$ {
        expires max;
        log_not_found off;
    }

    # Prevent direct access to hidden files like .env
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
